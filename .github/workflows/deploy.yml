name: Production image
on:
  push: {branches: [main]}
jobs:
  image:
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      PRODUCTION_DEPLOY_WEBHOOK: ${{ secrets.PRODUCTION_DEPLOY_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve lowercase container image name
        shell: bash
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "${{ env.IMAGE_NAME }}:latest"}
      - name: Deploy on company server
        if: "${{ env.PRODUCTION_DEPLOY_WEBHOOK != '' }}"
        run: curl --fail --request POST "$PRODUCTION_DEPLOY_WEBHOOK"
