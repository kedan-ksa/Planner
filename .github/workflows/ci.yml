name: CI
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
jobs:
  container:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Docker image without publishing
        run: docker build --tag planner-ci .
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: {DATABASE_URL: "postgresql://user:pass@localhost:5432/ci", AUTH_SECRET: "ci-only-not-a-production-secret"}
