name: CI
on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]
jobs:
  container:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Docker image without publishing
        run: docker build --tag planner-ci .
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: {DATABASE_URL: "postgresql://user:pass@localhost:5432/ci", AUTH_SECRET: "ci-only-not-a-production-secret"}
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d planner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/planner_ci
      RUN_DATABASE_TESTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: npm test -- tests/database-concurrency.integration.test.ts
